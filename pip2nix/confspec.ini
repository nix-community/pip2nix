[pip2nix]
requirements = strings()
constraints = strings(default=list())
output = string(default="./python-packages.nix")
no_index = boolean(default=False)
only_direct = boolean(default=False)
licenses = boolean(default=False)
excluded_packages = strings(default=list('pip', 'setuptools', 'wheel'))
index_url = string(default="https://pypi.python.org/simple")
extra_index_url = strings(default=list())
