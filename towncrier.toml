# The six Keep a Changelog entry types. towncrier ships a different set
# of its own, so the mapping is configuration rather than something the
# tool knows.
[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.rst"
start_string = ".. towncrier release notes start\n"
title_format = "{version} - {project_date}"
issue_format = "{issue}"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true
